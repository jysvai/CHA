<text x="40" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" font-weight="700" fill="#ff7b62">실행으로 가른다 / split by execution</text>
<text x="40" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#8b949e">a claim is true when you have run something that would behave differently if it were false</text>
