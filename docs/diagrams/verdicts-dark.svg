<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="t d">
<title id="t">CHA — 57 claims, split by execution</title>
<desc id="d">Fifty-seven second-eye claims enter and are split by execution, not by reading. Twenty-two were true and nineteen fixes landed. The false ones were recorded with counter-evidence and no code was edited. Four were unmeasurable and were recorded as unmeasurable, never as false.</desc>
