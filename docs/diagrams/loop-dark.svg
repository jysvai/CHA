<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="t d">
<title id="t">CHA — the nine-step loop</title>
<desc id="d">Nine steps in a closed cycle: hunt, brief, second eye, adjudicate, red test, fix, mutant, gate, record. Step three runs on another platform and is read-only. While the open issue count is above zero the loop returns to step one.</desc>
<rect x="0" y="0" width="1200" height="780" fill="#0d1117"/><text x="50" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="700" fill="#e6edf3">CHA — 순환형 적대적 하네싱</text>
<text x="50" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#8b949e">Cyclic Hostile Adversarial Harnessing · the nine-step loop</text>
<line x1="50" y1="92" x2="1150" y2="92" stroke="#30363d" stroke-width="1"/>
<rect x="806" y="112" width="358" height="164" rx="10" fill="none" stroke="#ff7b62" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="818" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" font-weight="600" fill="#ff7b62">다른 플랫폼 · 읽기 전용</text>
<text x="818" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#8b949e">another platform · read-only</text>
<rect x="50" y="140" width="330" height="92" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<circle cx="76" cy="168" r="13" fill="#ff7b62"/><text x="76" y="173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">1</text>
<text x="100" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15.5" font-weight="700" fill="#e6edf3">사냥</text><text x="100" y="187" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#8b949e">hunt</text>
<text x="68" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8b949e">first eye reads a slice, writes suspicions</text>
<rect x="435" y="140" width="330" height="92" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<circle cx="461" cy="168" r="13" fill="#ff7b62"/><text x="461" y="173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">2</text>
<text x="485" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15.5" font-weight="700" fill="#e6edf3">브리핑</text><text x="485" y="187" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#8b949e">brief</text>
<text x="453" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8b949e">cut to ≤20KB + the promises</text>
<rect x="820" y="140" width="330" height="92" rx="8" fill="#161b22" stroke="#ff7b62" stroke-width="1.5"/>
<circle cx="846" cy="168" r="13" fill="#ff7b62"/><text x="846" y="173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">3</text>
<text x="870" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15.5" font-weight="700" fill="#e6edf3">2차 눈</text><text x="870" y="187" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#8b949e">second eye</text>
<text x="838" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8b949e">another platform, read-only</text>
<rect x="50" y="330" width="330" height="92" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<circle cx="76" cy="358" r="13" fill="#ff7b62"/><text x="76" y="363" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">4</text>
<text x="100" y="357" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15.5" font-weight="700" fill="#e6edf3">판정</text><text x="100" y="377" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#8b949e">adjudicate</text>
<text x="68" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8b949e">run it: 참 / 거짓 / 못 잼</text>
<rect x="435" y="330" width="330" height="92" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<circle cx="461" cy="358" r="13" fill="#ff7b62"/><text x="461" y="363" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">5</text>
<text x="485" y="357" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15.5" font-weight="700" fill="#e6edf3">빨간 검사</text><text x="485" y="377" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#8b949e">red test</text>
<text x="453" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8b949e">prove the failure first</text>
<rect x="820" y="330" width="330" height="92" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<circle cx="846" cy="358" r="13" fill="#ff7b62"/><text x="846" y="363" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">6</text>
<text x="870" y="357" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15.5" font-weight="700" fill="#e6edf3">고침</text><text x="870" y="377" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#8b949e">fix</text>
<text x="838" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8b949e">one writer, one defect</text>
<rect x="50" y="480" width="330" height="92" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<circle cx="76" cy="508" r="13" fill="#ff7b62"/><text x="76" y="513" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">7</text>
<text x="100" y="507" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15.5" font-weight="700" fill="#e6edf3">어긋</text><text x="100" y="527" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#8b949e">mutant</text>
<text x="68" y="554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8b949e">break it on purpose</text>
<rect x="435" y="480" width="330" height="92" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<circle cx="461" cy="508" r="13" fill="#ff7b62"/><text x="461" y="513" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">8</text>
<text x="485" y="507" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15.5" font-weight="700" fill="#e6edf3">관문</text><text x="485" y="527" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#8b949e">gate</text>
<text x="453" y="554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8b949e">real numbers, not "pass"</text>
<rect x="820" y="480" width="330" height="92" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<circle cx="846" cy="508" r="13" fill="#ff7b62"/><text x="846" y="513" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">9</text>
<text x="870" y="507" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="15.5" font-weight="700" fill="#e6edf3">기록</text><text x="870" y="527" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#8b949e">record</text>
<text x="838" y="554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8b949e">append, never delete</text>
