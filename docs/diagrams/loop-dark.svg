<rect x="462" y="634" width="236" height="26" rx="4" fill="#0d1117"/>
<text x="580" y="652" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#ff7b62" text-anchor="middle">이슈 &gt; 0 ? / issues &gt; 0 ?</text>
<text x="50" y="706" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" fill="#e6edf3">관문이 초록이고 열린 항목이 0 일 때만 멈춘다. 배포는 사람이 허락한 뒤에만.</text>
<text x="50" y="728" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8b949e">It stops only when the gate is green and the open count is zero. Nothing ships without an explicit human go-ahead.</text>
</svg>
