<line x1="50" y1="424" x2="950" y2="424" stroke="#d0d0d0"/>
<text x="50" y="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#1a1a1a">실행이 아니라 그럴듯함으로 움직였으면, 멀쩡한 코드에 35번 손을 댔을 것이다.</text>
<text x="50" y="474" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6b6b6b">Acting on plausibility instead of execution would have meant 35 edits to working code.</text>
<text x="50" y="496" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#6b6b6b">57 − 22 = 35. 잰 숫자다, 어림이 아니다 / measured, not estimated.</text>
</svg>
