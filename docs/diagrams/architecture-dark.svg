<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" role="img" aria-labelledby="t d">
<title id="t">CHA — how the pieces connect</title>
<desc id="d">A left-to-right data flow. Everything with write access is on the left of a dashed read-only boundary: the plugin tools, the .cha files and the one writer. On the right is the second eye, on another platform with a pinned model id and no write tools, no shell and no repository access. It receives briefing text and returns claim text, and nothing else crosses.</desc>
<rect x="0" y="0" width="1240" height="760" fill="#0d1117"/><text x="50" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="700" fill="#e6edf3">조각들이 어떻게 붙나 · how the pieces connect</text>
<text x="50" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#8b949e">one writer on the left · a read-only second eye on the right · every artefact under .cha/</text>
