<text x="40" y="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" fill="#e6edf3">쓰는 곳이 둘이면 두 수정이 만나는 자리를 아무도 안 읽는다. 반만 붙은 고침이 나오는 자리가 거기다 — 세 번 나왔다.</text>
<text x="40" y="722" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8b949e">Two writers produce edits whose interaction nobody read. That is where half-applied fixes come from — found three times.</text>
